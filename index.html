<!DOCTYPE html>
<html lang="en">
  <head>
    <title>AR Art-Gallery</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="./css/index.css" />
	<link rel="shortcut icon" type="image/png" href="assets/Icons/favicon.png">	
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
        }
      }
    </script>
    <style>
      /* Styling for the log messages */
      #log-container {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background-color: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 10px;
        border-radius: 8px;
        font-family: Arial, sans-serif;
        font-size: 14px;
        max-width: 80%;
        z-index: 1000;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="bg"></div>
    <div class="main-container">
      <div class="header">
        <div id="AR-title" class="AR-title"></div>
        <div class="ar-exp"></div>
      </div>
      <div id="middle-part" class="middle-part page-2-middle-part">
        <div class="steps">
          <p>For the best AR viewing experience, follow these steps:</p>
        </div>
        <div class="image"></div>
        <div class="steps2">
          <p>Stand at the center of your living room with 4 feet of empty space.</p>
          <p>Point the camera at a flat surface and scan it when prompted.</p>
          <p>Enjoy your AR image!</p>
        </div>
      </div>
    </div>

    <div id="overlay">
      <div id="log-container">Initializing AR...</div>
      <div id="look_for_surface_icon"></div>
      <div id="close_ar_button"></div>
      <div id="footer" class="footer footer-2"></div>
    </div>

<script type="module">
  import * as THREE from "three";
  import { ARButton } from "three/addons/webxr/ARButton.js";

let camera, scene, renderer;
let controller;
let reticle = null;
let hitSomething = false;
let imageMesh = null;

const look_for_surface_icon = document.getElementById("look_for_surface_icon");
const logContainer = document.getElementById("log-container");
const close_ar_button = document.getElementById("close_ar_button");

const images = [
    "./assets/Arts/ar1.jpg",
    "./assets/Arts/ar2.jpg",
    "./assets/Arts/ar3.jpg"
];

let currentImageIndex = 0; // Track the image to be placed

function init() {
    const container = document.createElement("div");
    document.body.appendChild(container);

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
    directionalLight.position.set(5, 10, 5);
    scene.add(directionalLight);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    container.appendChild(renderer.domElement);

    document.getElementById("middle-part").appendChild(
        ARButton.createButton(renderer, {
            requiredFeatures: ["local", "hit-test"],
            optionalFeatures: ["dom-overlay"],
            domOverlay: { root: document.getElementById("overlay") },
        })
    );

    controller = renderer.xr.getController(0);
    controller.addEventListener("select", onSelect);
    scene.add(controller);

    addReticleToScene();
    renderer.xr.addEventListener('sessionstart', () => {
        logStatus("AR Session Started");
        addImageToScene(currentImageIndex); // Add the first image on AR session start.
        initializeHitTestSource();
    });
}

function logStatus(message) {
    logContainer.textContent = message;
    console.log(message);
}

function addReticleToScene() {
    const geometry = new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2);
    const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
    reticle = new THREE.Mesh(geometry, material);
    reticle.matrixAutoUpdate = false;
    reticle.visible = false; // Initially, the reticle is hidden
    scene.add(reticle);
}

function addImageToScene(index) {
    if (index < images.length) {
        logStatus("Loading image...");

        const imageTexture = new THREE.TextureLoader().load(
            images[index],
            (texture) => {
                logStatus("Image loaded successfully.");
                const imageGeometry = new THREE.PlaneGeometry(1, 1);
                const imageMaterial = new THREE.MeshBasicMaterial({
                    map: texture,
                    transparent: true,
                    side: THREE.DoubleSide,
                });

                // If there's already a placed image, remove it before adding the new one
                if (imageMesh) {
                    scene.remove(imageMesh);
                }

                imageMesh = new THREE.Mesh(imageGeometry, imageMaterial);
                imageMesh.visible = false; 
                scene.add(imageMesh);
                logStatus("Image added to the scene.");
            },
            undefined,
            () => logStatus("Error loading image.")
        );
    } else {
        logStatus("No more images to place.");
    }
}

// Handling the select event (tap to place image)
let isPlacing = false;

function onSelect() {
    if (hitSomething && reticle.visible) {
        if (isPlacing) {
            logStatus("Already placing an image.");
            return;
        }
        isPlacing = true;

        if (imageMesh && !imageMesh.visible) {
            // Place the image at the reticle's position
            imageMesh.position.setFromMatrixPosition(reticle.matrix);
            const rotation = new THREE.Quaternion().setFromRotationMatrix(reticle.matrix);
            imageMesh.quaternion.copy(rotation);
            imageMesh.visible = true; // Make the image visible once placed

            // Hide the reticle and "Looking for a surface" icon once the image is placed
            reticle.visible = false; 
            look_for_surface_icon.style.visibility = "hidden"; 

            // Show the log status message about image placement
            logStatus("Only one image can be added at a time. Tap the image to remove it, then tap anywhere to place it again.");

            // Optionally, you can disable further placement or interaction until the user removes the image
            setTimeout(() => {
                isPlacing = false;
            }, 500); 
        } else {
            logStatus("Image already placed or no current image mesh to place.");
        }
    } else {
        logStatus("No surface detected or reticle not visible.");
    }
}

// Function to remove an image when clicked
function removeImage(imageMesh) {
    if (imageMesh) {
        scene.remove(imageMesh);
        logStatus("Image removed.");

        // Reset imageMesh to null so the user can add a new one
        imageMesh = null;

        // Show the log status message again
        logStatus("Only one image can be added at a time. Tap anywhere to place a new image.");

        // Show the reticle and the "Looking for a surface" icon again
        reticle.visible = true;
        look_for_surface_icon.style.visibility = "visible";  // Ensure the icon for finding surfaces is visible.

        // Optionally reset currentImageIndex to 0
        currentImageIndex = 0; 
    } else {
        logStatus("No image mesh to remove.");
    }
}

// Function to check if the user clicked on an existing image for removal
function checkForImageRemoval(event) {
    if (!hitSomething || !reticle.visible) {
        return; 
    }
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera); 
    
    const intersects = raycaster.intersectObject(imageMesh); // Only check for the one image in the scene.
    
    if (intersects.length > 0) {
        removeImage(imageMesh);

        addImageToScene(currentImageIndex);  // Add the first image again or next image if required.
    }
}

close_ar_button.addEventListener("click", () => {
    const session = renderer.xr.getSession();
    if (session) {
        session.end(); 
    } else {
        location.reload(); 
    }
});

window.addEventListener('click', checkForImageRemoval);
init(); 
addImageToScene(currentImageIndex); 

let hitTestSource = null;
let localSpace = null;
let hitTestSourceInitialized = false;

async function initializeHitTestSource() {
    const session = renderer.xr.getSession();
    if (!session) {
        logStatus("Failed to start AR session.");
        return;
    }

    const viewerSpace = await session.requestReferenceSpace("viewer");
    localSpace = await session.requestReferenceSpace("local");

    try {
        hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
        hitTestSourceInitialized = true;
        logStatus("Hit test source initialized successfully.");
    } catch (error) {
        logStatus("Failed to initialize hit test source.");
        console.error(error);
    }

    session.addEventListener("end", () => {
        hitTestSourceInitialized = false;
        hitTestSource = null;
        close_ar_button.style.visibility = "hidden";
    });

    close_ar_button.style.visibility = "visible";
    logStatus("Looking for a surface...");
}

function render(timestamp, frame) {
    if (frame && hitTestSourceInitialized) {
        const hitTestResults = frame.getHitTestResults(hitTestSource);
        if (hitTestResults.length > 0) {
            hitSomething = true;
            const hit = hitTestResults[0];
            const pose = hit.getPose(localSpace);

            // Only show the reticle if there is no image placed
            if (!imageMesh || !imageMesh.visible) {
                reticle.visible = true;
                reticle.matrix.fromArray(pose.transform.matrix);
                logStatus("Surface found. Tap to place the image.");
                look_for_surface_icon.style.visibility = "hidden"; 
            }
        } else {
            hitSomething = false;
            reticle.visible = false; // Hide reticle when no surface is found
            look_for_surface_icon.style.visibility = "visible"; 
            logStatus("Looking for a surface...");
        }
    }
    renderer.render(scene, camera);
}

renderer.setAnimationLoop(render);

</script>

  </body>
</html>
